spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/agrovalle
    username: postgres
    password: ${DB_PASSWORD}
  
  sql:
    init:
      mode: never
  
  jpa:
    hibernate:
      naming:
        physical-strategy: com.agrovalle.QuotedAwareNamingStrategy
      
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

  