spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agrovalle}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  
  sql:
    init:
      mode: never
  
  jpa:
    hibernate:
      naming:
        physical-strategy: com.agrovalle.QuotedAwareNamingStrategy
      
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

  