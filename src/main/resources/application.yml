spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agrovalle}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET lock_timeout = 5000
  
  sql:
    init:
      mode: never
  
  jpa:
    hibernate:
      naming:
        physical-strategy: com.agrovalle.config.QuotedAwareNamingStrategy
      
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

  