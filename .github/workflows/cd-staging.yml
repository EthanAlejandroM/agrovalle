name: CD Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify (tests + JaCoCo)
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Checkstyle
        run: mvn --batch-mode --no-transfer-progress checkstyle:check

  deploy-staging:
    name: deploy-staging
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package jar
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      # Prueba de humo: arranca la app contra la BD de staging.
      # Un login con usuario inexistente consulta la BD y debe responder 401.
      # Si la BD no conecta, respondería 500 y el pipeline falla.
      - name: Smoke test against staging DB
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
          DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
        run: |
          java -jar target/agrovalle-connect-1.0-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -m 5 -o /dev/null -w "%{http_code}" -X POST \
              http://localhost:8080/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d '{"correo":"smoke@agrovalle.test","contrasena":"noexiste123"}' || true)
            if [ "$code" = "401" ]; then
              echo "App arriba y conectada a la BD de staging"
              exit 0
            fi
            echo "Intento $i: HTTP $code"
            sleep 3
          done
          echo "La app no respondió como se esperaba. Log:"
          cat app.log
          exit 1

      - name: Trigger deploy on Render
        run: curl -fsS -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"