name: Java CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile, test, and create JaCoCo report
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Enforce Checkstyle rules
        run: mvn --batch-mode --no-transfer-progress checkstyle:check

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
          if-no-files-found: warn
          retention-days: 7
